[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-rag"
version = "0.1.0"
description = "RAG assistant for STM32F4 datasheets with page-level citations"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",     # page text + table detection (find_tables)
    "pdfplumber>=0.11",  # alternative table extractor, compared against PyMuPDF
    "sentence-transformers>=3.0",  # local embedding models
    "psycopg[binary]>=3.1",  # PostgreSQL driver
    "pgvector>=0.3",         # adapts numpy arrays to pgvector's vector type in psycopg
    "python-dotenv>=1.0",    # reads the database settings from .env
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings at import time, not by our code.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
